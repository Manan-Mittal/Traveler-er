name = "traveler-er-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# Comma-separated list of sites allowed to call this API.
ALLOWED_ORIGINS = "https://manan-mittal.github.io,http://localhost:5173,http://localhost:4173"
# Google OAuth client id for "Sign in with Google". Public, not a secret.
GOOGLE_CLIENT_ID = ""

# Saved trips and sign-in sessions. Tables are created by the worker on first use.
[[d1_databases]]
binding = "DB"
database_name = "traveler-er"
database_id = "00000000-0000-0000-0000-000000000000"

# Secret, set with: npx wrangler secret put OPENROUTER_API_KEY
